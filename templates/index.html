<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimalist Pomodoro Timer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="work">
  <div class="progress-track">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <main class="container">
    <h1>Minimalist Pomodoro Timer</h1>
    <p class="session-label" id="session-label">Work Time</p>
    <p class="session-count" id="session-count">Session 1 of 4</p>

    <div class="timer" id="timer">25:00</div>

    <div class="controls">
      <button id="start-btn" class="primary">Start</button>
      <button id="reset-btn" class="secondary">Reset</button>
      <button id="mute-btn" class="ghost">Mute</button>
    </div>

    <div class="modes">
      <button id="short-break-btn" class="ghost">Short Break</button>
      <button id="long-break-btn" class="ghost">Long Break</button>
    </div>

    <div class="settings">
      <div class="settings-field">
        <label for="work-duration">Work (min)</label>
        <input id="work-duration" type="number" min="1" max="120" value="25" />
      </div>
      <div class="settings-field">
        <label for="short-break-duration">Short Break (min)</label>
        <input id="short-break-duration" type="number" min="1" max="60" value="5" />
      </div>
      <div class="settings-field">
        <label for="long-break-duration">Long Break (min)</label>
        <input id="long-break-duration" type="number" min="1" max="90" value="15" />
      </div>
    </div>

    <p class="hint" id="hint">25 minutes work · 5 minutes short break · 15 minutes long break</p>
  </main>

  <audio id="alarm" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" type="audio/ogg" />
    <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.mp3" type="audio/mpeg" />
  </audio>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
